<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Map the font names offered by the subtitle UI to fonts that actually exist
  in the Docker image. Without this, libass silently falls back to DejaVu for
  every choice, so the burned captions never match the in-browser preview
  (github issue #57). Liberation fonts are metric-compatible substitutes for
  the MS core fonts; Anton is the standard open substitute for Impact.
-->
<fontconfig>
  <alias binding="strong"><family>Verdana</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Arial</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Helvetica</family><prefer><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Georgia</family><prefer><family>Liberation Serif</family></prefer></alias>
  <alias binding="strong"><family>Impact</family><prefer><family>Anton</family></prefer></alias>
  <!--
    Courier New already resolves to Liberation Mono through Debian's own
    30-metric-aliases.conf, so this line changes nothing today. It is here to
    state the mapping locally rather than inherit it, matching the Sans/Serif
    entries above and surviving a base image whose defaults differ.
  -->
  <alias binding="strong"><family>Courier New</family><prefer><family>Liberation Mono</family></prefer></alias>
  <!--
    The display faces below ship as TTFs in this directory, so libass resolves
    them through fontsdir= without an alias. They are listed anyway so anything
    reading fontconfig alone (the Remotion render path, a future thumbnail
    renderer) agrees with the burn instead of substituting.
  -->
  <alias binding="strong"><family>Bebas Neue</family><prefer><family>Bebas Neue</family><family>Anton</family></prefer></alias>
  <alias binding="strong"><family>Archivo Black</family><prefer><family>Archivo Black</family><family>Liberation Sans</family></prefer></alias>
  <alias binding="strong"><family>Luckiest Guy</family><prefer><family>Luckiest Guy</family><family>Anton</family></prefer></alias>
</fontconfig>
